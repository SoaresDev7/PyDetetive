<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyDetetive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Segoe UI, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column; height: 90vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .header h1 { font-size: 28px; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; border-right: 1px solid #e0e0e0; padding: 15px; overflow-y: auto; }
        .editor-output { flex: 1; display: flex; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #e0e0e0; }
        .output-panel { flex: 1; display: flex; flex-direction: column; }
        .panel-header { background: #f5f5f5; padding: 12px 15px; border-bottom: 1px solid #e0e0e0; font-weight: 600; }
        #editor { flex: 1; padding: 15px; font-family: monospace; font-size: 14px; border: none; background: #f9f9f9; }
        #output { flex: 1; padding: 15px; overflow-y: auto; background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        .controls { display: flex; gap: 10px; padding: 15px; background: #f5f5f5; border-top: 1px solid #e0e0e0; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #runBtn { background: #667eea; color: white; flex: 1; }
        #clearBtn { background: #f0f0f0; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 PyDetetive</h1>
            <p>Descubra quem levou o robô Lumi!</p>
        </div>
        <div class="main-content">
            <div class="sidebar">
                <h3>Fase 1</h3>
                <p>Print, variáveis, input</p>
            </div>
            <div class="editor-output">
                <div class="editor-panel">
                    <div class="panel-header">Editor Python</div>
                    <textarea id="editor">print("Bem-vindo!")</textarea>
                </div>
                <div class="output-panel">
                    <div class="panel-header">Saída</div>
                    <div id="output">Clique em Executar...</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="runBtn">▶ Executar</button>
            <button id="clearBtn">🗑 Limpar</button>
        </div>
    </div>
    <script async src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script>
        let pyodideReady = false;
        async function init() {
            await loadPyodide();
            pyodideReady = true;
            document.getElementById('output').textContent = 'Python pronto!';
        }
        document.getElementById('runBtn').addEventListener('click', async () => {
            if (!pyodideReady) return;
            const code = document.getElementById('editor').value;
            try {
                const result = await pyodide.runPythonAsync(code);
                document.getElementById('output').textContent = result || '(sem saída)';
            } catch(e) {
                document.getElementById('output').textContent = 'Erro: ' + e.message;
            }
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('output').textContent = '';
        });
        init();
    </script>
</body>
</html>
